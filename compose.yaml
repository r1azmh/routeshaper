name: routeshaper

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: routeshaper:local
    restart: unless-stopped
    init: true
    ports:
      - "${HOST_IP:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      ORS_SECRET_KEY: ${ORS_SECRET_KEY:?Set ORS_SECRET_KEY in the root .env file}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-600}
      DJANGO_SETTINGS_MODULE: vrp.docker_settings
      APP_DATA_DIR: /data
    volumes:
      - routeshaper-data:/data
    stop_grace_period: 650s

volumes:
  routeshaper-data:
