name: Docker installation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      ORS_SECRET_KEY: ci-only-not-a-real-ors-key
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check pages, bundled assets, and public logo
        run: python3 scripts/smoke_test.py
      - name: Check database schema and native solver
        run: docker compose exec -T web python /app/docker/check_runtime.py
      - name: Check startup after container recreation
        run: |
          docker compose up --detach --force-recreate --wait --wait-timeout 180
          python3 scripts/smoke_test.py
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up CI-only containers and data
        if: always()
        run: docker compose down --volumes
